<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PG A1 | Super Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=DM+Sans:wght@300;400;500;600;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { cream:'#faf6f0', warm:'#f2ebe0', sand:'#e8d8c4', amber:'#c8813a', 'amber-hover':'#e09a50', dark:'#1a1410', charcoal:'#3d3028', mid:'#7a6655', light:'#b8a898', success:'#2d6a4f', 'success-bg':'#d8f3dc', danger:'#c1121f', 'danger-bg':'#fde8e8', info:'#1d4ed8', 'info-bg':'#dbeafe' },
        fontFamily: { display:['Playfair Display','serif'], body:['DM Sans','sans-serif'], brand:['Roboto','sans-serif'] },
        boxShadow: { card:'0 4px 32px rgba(26,20,16,0.10)', 'card-hover':'0 12px 48px rgba(26,20,16,0.18)' }
      }}
    }
  </script>
  <style>body{font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}.sidebar-scrollbar::-webkit-scrollbar{width:4px}.sidebar-scrollbar::-webkit-scrollbar-thumb{background:rgba(200,129,58,0.3);border-radius:10px}</style>
</head>
<body class="bg-cream text-charcoal overflow-x-hidden">

<!-- Sidebar -->
<aside id="sidebar" class="fixed h-screen w-60 left-0 top-0 bg-dark flex flex-col z-40 hidden md:flex">
  <div class="p-6 flex items-start justify-between">
    <div>
      <div class="flex items-end gap-0">
        <span class="font-brand text-lg font-bold text-white">PG&nbsp;A</span>
        <span class="font-brand text-3xl font-black text-amber leading-[0.82]">1</span>
      </div>
      <p class="text-[11px] font-semibold tracking-[0.18em] uppercase text-light mt-1">Super Admin</p>
    </div>
    <button class="md:hidden p-1 text-light hover:text-white" onclick="closeSidebar()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <nav class="flex-1 mt-2 sidebar-scrollbar overflow-y-auto" id="sidebar-nav">
    <a class="flex items-center gap-3 px-5 py-3 border-l-4 border-amber text-white bg-charcoal" data-page="dashboard">
      <span class="material-symbols-outlined text-amber">dashboard</span>
      <span class="text-sm font-medium">Dashboard</span>
    </a>
    <a class="flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-page="pg-locations">
      <span class="material-symbols-outlined">location_city</span>
      <span class="text-sm font-medium">PG Locations</span>
    </a>
    <a class="flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-page="admins">
      <span class="material-symbols-outlined">admin_panel_settings</span>
      <span class="text-sm font-medium">Admins</span>
    </a>
    <a class="flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-page="tenants">
      <span class="material-symbols-outlined">groups</span>
      <span class="text-sm font-medium">All Tenants</span>
    </a>
    <a class="flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-page="payments">
      <span class="material-symbols-outlined">payments</span>
      <span class="text-sm font-medium">Payments</span>
    </a>
    <a class="flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-page="onboarding">
      <span class="material-symbols-outlined">person_add</span>
      <span class="text-sm font-medium">Onboarding</span>
    </a>
  </nav>
  <div class="p-4 border-t border-charcoal">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber flex items-center justify-center text-white font-bold text-sm" id="user-avatar">SA</div>
      <div>
        <p class="text-sm font-bold text-white" id="user-name">Super Admin</p>
        <button onclick="api.logout()" class="text-[10px] tracking-wider uppercase text-light hover:text-amber transition-colors">Logout</button>
      </div>
    </div>
  </div>
</aside>

<!-- Sidebar backdrop (mobile only) -->
<div id="sidebar-overlay" class="md:hidden fixed inset-0 bg-black/50 z-[35] hidden" onclick="closeSidebar()"></div>

<!-- Top Header -->
<header class="fixed top-0 right-0 md:left-60 left-0 h-16 bg-white border-b border-sand shadow-sm flex justify-between items-center px-4 md:px-6 z-30">
  <div class="flex items-center gap-3">
    <button class="md:hidden p-2 text-dark" onclick="toggleSidebar()">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <h2 class="font-display text-lg font-bold text-dark md:hidden">PG A1</h2>
  </div>
  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold text-mid hidden md:block">PG A1 Management</span>
    <span class="text-[10px] bg-amber text-white px-2 py-0.5 rounded-full font-bold">v1.0</span>
    <button onclick="api.logout()" class="p-2 text-mid hover:text-amber hover:bg-warm rounded-full transition-all" title="Logout">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>

<!-- Main Content -->
<main class="md:ml-60 min-h-screen px-4 pb-4 md:px-6 md:pb-6" style="padding-top:5rem;" id="main-content">
  <!-- Loading state -->
  <div id="loading" class="flex items-center justify-center h-64">
    <div class="text-center">
      <span class="material-symbols-outlined text-4xl text-amber animate-spin">progress_activity</span>
      <p class="text-sm text-mid mt-2">Loading dashboard...</p>
    </div>
  </div>

  <!-- Dashboard content (injected by JS) -->
  <div id="dashboard-content" class="hidden"></div>
</main>

<script src="js/api.js"></script>
<script src="js/modal.js"></script>
<script>
  // Auth guard
  if (!requireAuth(['super_admin'])) throw new Error('Unauthorized');

  const user = api.getUser();
  document.getElementById('user-name').textContent = user.name;
  document.getElementById('user-avatar').textContent = user.name.split(' ').map(w => w[0]).join('').substring(0, 2);

  // Mobile sidebar drawer
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('hidden');
    document.getElementById('sidebar-overlay').classList.toggle('hidden');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.add('hidden');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }

  // ─── Navigation ───────────────────────────────────────────────
  let currentSection = 'dashboard';

  document.querySelectorAll('#sidebar-nav a[data-page]').forEach(link => {
    link.style.cursor = 'pointer';
    link.addEventListener('click', () => { showSection(link.dataset.page); closeSidebar(); });
  });

  async function showSection(section) {
    currentSection = section;
    const content = document.getElementById('dashboard-content');
    const loading = document.getElementById('loading');
    content.classList.add('hidden');
    loading.classList.remove('hidden');
    loading.innerHTML = '<div class="flex items-center justify-center h-64"><span class="material-symbols-outlined text-4xl text-amber animate-spin">progress_activity</span></div>';

    // Update active nav
    document.querySelectorAll('#sidebar-nav a[data-page]').forEach(a => {
      a.classList.remove('border-amber', 'text-white', 'bg-charcoal');
      a.classList.add('border-transparent', 'text-light');
    });
    const activeLink = document.querySelector(`#sidebar-nav a[data-page="${section}"]`);
    if (activeLink) {
      activeLink.classList.add('border-amber', 'text-white', 'bg-charcoal');
      activeLink.classList.remove('border-transparent', 'text-light');
    }

    try {
      switch (section) {
        case 'dashboard': await loadDashboard(); return;
        case 'tenants': await loadTenants(); break;
        case 'pg-locations': await loadPgLocations(); break;
        case 'admins': await loadAdminsPage(); break;
        case 'payments': await loadPayments(); break;
        case 'onboarding': await loadOnboarding(); break;
      }
    } catch (err) {
      content.innerHTML = `<p class="text-danger text-center py-8">Error: ${err.data?.message || 'Failed to load'} <button onclick="showSection('${section}')" class="text-amber font-bold ml-2">Retry</button></p>`;
      content.classList.remove('hidden');
      loading.classList.add('hidden');
    }
  }

  // ─── Dashboard ────────────────────────────────────────────────
  async function loadDashboard() {
    const [dashData, pgData] = await Promise.all([
      api.superAdminDashboard(),
      api.adminPgLocations()
    ]);
    const content = document.getElementById('dashboard-content');
    content.innerHTML = renderDashboard(dashData, pgData.pg_locations || []);
    content.classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
  }

  function renderDashboard(stats, pgLocations) {
    return `
      <!-- Header -->
      <div class="mb-6 flex flex-wrap justify-between items-start sm:items-center gap-3">
        <div>
          <h2 class="font-display text-2xl md:text-3xl font-black text-dark">Super Admin Dashboard</h2>
          <p class="text-sm text-mid mt-1">Real-time overview across all PG locations.</p>
        </div>
        <button onclick="showAddPgModal()" class="bg-amber text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-amber-hover transition-all active:scale-95 shadow-card font-semibold text-sm whitespace-nowrap">
          <span class="material-symbols-outlined text-lg">add</span>Add New PG
        </button>
      </div>

      <!-- Metrics -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">PG Locations</p>
              <h3 class="font-display text-3xl font-black text-dark mt-1">${stats.total_pg_locations}</h3>
            </div>
            <div class="bg-warm p-2 rounded-xl"><span class="material-symbols-outlined text-amber">location_city</span></div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Total Beds</p>
              <h3 class="font-display text-3xl font-black text-dark mt-1">${stats.total_beds}</h3>
              <p class="text-xs text-success mt-1">${stats.available_beds} available</p>
            </div>
            <div class="bg-warm p-2 rounded-xl"><span class="material-symbols-outlined text-amber">bed</span></div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Active Tenants</p>
              <h3 class="font-display text-3xl font-black text-dark mt-1">${stats.total_tenants}</h3>
            </div>
            <div class="bg-success-bg p-2 rounded-xl"><span class="material-symbols-outlined text-success">groups</span></div>
          </div>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
          <div class="flex items-start justify-between">
            <div>
              <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Pending Payments</p>
              <h3 class="font-display text-3xl font-black ${stats.pending_payments > 0 ? 'text-danger' : 'text-dark'} mt-1">${stats.pending_payments}</h3>
            </div>
            <div class="bg-danger-bg p-2 rounded-xl"><span class="material-symbols-outlined text-danger">pending_actions</span></div>
          </div>
        </div>
      </div>

      <!-- PG Locations Grid -->
      <div class="bg-white p-5 rounded-2xl border border-sand shadow-card mb-6">
        <div class="flex justify-between items-center mb-4 border-b border-sand pb-3">
          <h4 class="font-display text-lg font-bold text-dark">PG Locations</h4>
          <span class="text-xs text-mid">${pgLocations.length} locations</span>
        </div>
        ${pgLocations.length === 0 ? '<p class="text-sm text-mid text-center py-8">No PG locations yet. Add your first one!</p>' :
        `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${pgLocations.map(pg => `
            <div class="p-4 bg-warm rounded-xl hover:shadow-card transition-all cursor-pointer" onclick="showEditPgModal(${pg.id})">
              <div class="flex items-start justify-between">
                <div>
                  <h5 class="text-sm font-bold text-dark">${pg.name}</h5>
                  <p class="text-xs text-mid mt-0.5">${pg.address || pg.city || ''}</p>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-bold ${pg.is_active ? 'text-success bg-success-bg' : 'text-danger bg-danger-bg'} px-2 py-0.5 rounded-full">${pg.is_active ? 'Active' : 'Inactive'}</span>
                  <span class="material-symbols-outlined text-sm text-amber">edit</span>
                </div>
              </div>
              <div class="flex items-center gap-4 mt-3 text-xs text-mid">
                <span>🏠 ${pg.rooms_count || 0} rooms</span>
                <span>🛏 ${pg.tenants_count || 0} tenants</span>
                <span>📷 ${(pg.photos || []).length} photos</span>
              </div>
            </div>
          `).join('')}
        </div>`}
      </div>

      <!-- Quick Actions -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <button onclick="showAddPgModal()" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left group">
          <span class="material-symbols-outlined text-amber text-2xl">add_business</span>
          <p class="text-xs font-bold text-dark mt-2">Add PG Location</p>
        </button>
        <button onclick="loadAdmins()" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left group">
          <span class="material-symbols-outlined text-amber text-2xl">person_add</span>
          <p class="text-xs font-bold text-dark mt-2">Add Admin</p>
        </button>
        <button onclick="generateRentPrompt()" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left group">
          <span class="material-symbols-outlined text-amber text-2xl">receipt_long</span>
          <p class="text-xs font-bold text-dark mt-2">Generate Rent</p>
        </button>
        <button onclick="generateOnboardingLink()" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left group">
          <span class="material-symbols-outlined text-amber text-2xl">link</span>
          <p class="text-xs font-bold text-dark mt-2">Onboarding Link</p>
        </button>
      </div>
    `;
  }

  // ─── Actions ──────────────────────────────────────────────────
  async function showAddPgModal() {
    openModal(`
      <div class="p-6">
        <h3 class="font-display text-lg font-bold text-[#1a1410] mb-4">Add New PG Location</h3>
        <div class="space-y-3">
          ${buildFormField('pg-name', 'PG Name', 'text', 'e.g. PG A1 – Sector 50')}
          ${buildFormField('pg-address', 'Full Address', 'text', 'Street, Area, City')}
          <div class="grid grid-cols-2 gap-3">
            ${buildFormField('pg-city', 'City', 'text', '', 'Gurugram')}
            ${buildFormField('pg-pincode', 'Pincode', 'text', '122001')}
          </div>
          ${buildFormField('pg-prefix', 'Tenant ID Prefix', 'text', 'e.g. TSN, TJV, TS50')}
          ${buildFormField('pg-rent', 'Starting Rent (₹)', 'number', '8000')}
        </div>
        <div class="flex gap-3 mt-5">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4] hover:bg-[#f2ebe0]">Cancel</button>
          <button onclick="submitAddPg()" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-[#c8813a] hover:bg-[#e09a50]">Create PG</button>
        </div>
      </div>
    `);
  }

  async function submitAddPg() {
    const name = document.getElementById('pg-name').value.trim();
    const address = document.getElementById('pg-address').value.trim();
    const city = document.getElementById('pg-city').value.trim() || 'Gurugram';
    const pincode = document.getElementById('pg-pincode').value.trim();
    const prefix = document.getElementById('pg-prefix').value.trim();
    const rent = document.getElementById('pg-rent').value;

    if (!name || !prefix) { showToast('Name and Prefix are required', 'error'); return; }

    closeModal();
    try {
      await api.createPgLocation({ name, address, city, pincode, tenant_id_prefix: prefix, starting_rent: parseFloat(rent) || 0, state: 'Haryana' });
      showToast('PG Location created successfully!');
      loadDashboard();
    } catch (err) {
      showToast(err.data?.message || 'Failed to create PG', 'error');
    }
  }

  // ─── Edit PG Location (Website Display Settings) ─────────────
  async function showEditPgModal(pgId) {
    try {
      const data = await api.get(`/admin/pg-locations/${pgId}`);
      const pg = data.pg_location;
      const meta = pg.metadata || {};
      const photos = pg.photos || [];

      openModal(`
        <div class="p-6 max-h-[85vh] overflow-y-auto">
          <h3 class="font-display text-lg font-bold text-[#1a1410] mb-1">Edit PG — Website Display</h3>
          <p class="text-xs text-[#7a6655] mb-4">${pg.name} • Changes reflect on the public website</p>
          <div class="space-y-3">
            ${buildFormField('epg-name', 'PG Name', 'text', '', pg.name)}
            ${buildFormField('epg-address', 'Address', 'text', '', pg.address || '')}
            <div class="grid grid-cols-2 gap-3">
              ${buildFormField('epg-city', 'City', 'text', '', pg.city || 'Gurugram')}
              ${buildFormField('epg-rent', 'Display Rent (₹/month)', 'number', '', pg.starting_rent || 0)}
            </div>
            ${buildFormField('epg-sharing', 'Sharing Type', 'text', 'e.g. Double Sharing, Triple, 1BHK', meta.sharing_type || 'Double Sharing')}
            ${buildFormField('epg-whatsapp', 'WhatsApp Number (with 91)', 'tel', 'e.g. 919310226604', meta.whatsapp || pg.contact_mobile || '')}
            ${buildFormField('epg-phone', 'Contact Phone', 'tel', '', pg.contact_mobile || '')}
            ${buildFormField('epg-map-link', 'Google Maps Link', 'text', 'https://maps.google.com/...', meta.map_link || '')}
            <div>
              <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">Google Maps Embed (iframe src)</label>
              <textarea id="epg-map-iframe" rows="2" placeholder="Paste iframe src URL from Google Maps embed" class="w-full bg-[#f2ebe0] text-xs px-3 py-2 rounded-xl border border-[#e8d8c4] focus:ring-2 focus:ring-[#c8813a] outline-none resize-y">${meta.map_iframe || ''}</textarea>
            </div>
            <div>
              <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">Amenities (comma-separated)</label>
              <input id="epg-amenities" type="text" value="${(meta.amenities || []).join(', ')}" placeholder="AC, Wi-Fi, Food, Laundry, Parking" class="w-full bg-[#f2ebe0] text-sm px-3 py-2.5 rounded-xl border border-[#e8d8c4] focus:ring-2 focus:ring-[#c8813a] outline-none" />
            </div>
            ${buildFormField('epg-meals', 'Meals Info', 'text', 'e.g. Breakfast & Dinner included', meta.meals || '')}
            <div>
              <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">Tags (comma-separated)</label>
              <input id="epg-tags" type="text" value="${(meta.tags || []).join(', ')}" placeholder="Near Metro, Corporate Area, Furnished" class="w-full bg-[#f2ebe0] text-sm px-3 py-2.5 rounded-xl border border-[#e8d8c4] focus:ring-2 focus:ring-[#c8813a] outline-none" />
            </div>
            <div>
              <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">Description</label>
              <textarea id="epg-desc" rows="2" class="w-full bg-[#f2ebe0] text-sm px-3 py-2 rounded-xl border border-[#e8d8c4] focus:ring-2 focus:ring-[#c8813a] outline-none resize-y">${pg.description || ''}</textarea>
            </div>

            <!-- Photos -->
            <div>
              <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-2">Photos (${photos.length})</label>
              <div class="flex flex-wrap gap-2 mb-2">
                ${photos.map((p, i) => `<div class="relative"><img src="${p}" class="w-16 h-16 rounded-lg object-cover border border-[#e8d8c4]" /><button onclick="removePgPhoto(${pgId},'${p}')" class="absolute -top-1 -right-1 w-4 h-4 bg-[#c1121f] text-white rounded-full text-[8px] flex items-center justify-center">×</button></div>`).join('')}
              </div>
              <input type="file" id="epg-photos" multiple accept="image/*" class="w-full text-xs file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#f2ebe0] file:text-[#3d3028] hover:file:bg-[#e8d8c4]" />
            </div>

            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" id="epg-active" ${pg.is_active ? 'checked' : ''} class="rounded border-[#e8d8c4] text-[#c8813a] focus:ring-[#c8813a]" />
              <span class="text-xs text-[#3d3028] font-medium">Active (visible on website)</span>
            </label>
          </div>
          <div class="flex gap-3 mt-5">
            <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4] hover:bg-[#f2ebe0]">Cancel</button>
            <button onclick="submitEditPg(${pgId})" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-[#c8813a] hover:bg-[#e09a50]">Save Changes</button>
          </div>
        </div>
      `);
    } catch(err) { showToast('Failed to load PG details', 'error'); }
  }

  async function submitEditPg(pgId) {
    const name = document.getElementById('epg-name').value.trim();
    const address = document.getElementById('epg-address').value.trim();
    const city = document.getElementById('epg-city').value.trim();
    const rent = document.getElementById('epg-rent').value;
    const sharing = document.getElementById('epg-sharing').value.trim();
    const whatsapp = document.getElementById('epg-whatsapp').value.trim();
    const phone = document.getElementById('epg-phone').value.trim();
    const mapLink = document.getElementById('epg-map-link').value.trim();
    const mapIframe = document.getElementById('epg-map-iframe').value.trim();
    const amenities = document.getElementById('epg-amenities').value.split(',').map(s => s.trim()).filter(Boolean);

    const desc = document.getElementById('epg-desc').value.trim();
    const isActive = document.getElementById('epg-active').checked;

    closeModal();
    try {
      await api.put(`/super-admin/pg-locations/${pgId}`, {
        name, address, city,
        starting_rent: parseFloat(rent) || 0,
        contact_mobile: phone,
        description: desc,
        is_active: isActive,
        metadata: { sharing_type: sharing, whatsapp, map_link: mapLink, map_iframe: mapIframe, amenities, meals, tags }

      loadDashboard();
    } catch(err) { showToast(err.data?.message || 'Failed to update', 'error'); }

  async function submitCreateAdmin() {
    const name = document.getElementById('admin-name').value.trim();
    const mobile = document.getElementById('admin-mobile').value.trim();
    const password = document.getElementById('admin-password').value;
    const checkboxes = document.querySelectorAll('.admin-pg-checkbox:checked');

    closeModal();

        <div class="flex gap-3 mt-5">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4] hover:bg-[#f2ebe0]">Cancel</button>
          <button onclick="submitResetPassword(${adminId})" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-[#c8813a] hover:bg-[#e09a50]">Reset</button>
        </div>
      </div>
    `);
  }

  async function submitResetPassword(adminId) {
    const pwd = document.getElementById('reset-pwd').value;
    if (!pwd || pwd.length < 8) { showToast('Password must be at least 8 characters', 'error'); return; }
    closeModal();
    try {
      await api.put(`/super-admin/admins/${adminId}/reset-password`, { password: pwd });
      showToast('Password reset successfully! Share the new password with the admin.');
    } catch(err) { showToast(err.data?.message || 'Failed', 'error'); }
  }

  // ─── Payments Page ────────────────────────────────────────────
  async function loadPayments() {
    const data = await api.adminPayments();
    const payments = data.payments || [];
    const content = document.getElementById('dashboard-content');
    content.innerHTML = `
      <div class="mb-6">
        <h2 class="font-display text-2xl font-black text-dark">Pending Payments</h2>
        <p class="text-sm text-mid mt-1">${payments.length} payments awaiting verification</p>
      </div>
      ${payments.length === 0 ? '<div class="bg-white p-8 rounded-2xl border border-sand shadow-card text-center"><span class="material-symbols-outlined text-4xl text-success mb-2">check_circle</span><p class="text-success font-medium">All payments verified. Nothing pending!</p></div>' : `
      <div class="space-y-3">
        ${payments.map(p => `
          <div class="bg-white p-5 rounded-2xl border border-sand shadow-card flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
            <div>
              <p class="text-sm font-bold text-dark">${p.tenant?.user?.name || 'Tenant'} <span class="font-mono text-amber text-xs">${p.tenant?.tenant_id || ''}</span></p>
              <p class="text-xs text-mid">₹${parseInt(p.claimed_amount).toLocaleString('en-IN')} via ${p.payment_method} • ${p.payment_date || ''} • ${p.tenant?.pg_location?.name || ''}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="saVerifyPayment(${p.id}, ${p.claimed_amount})" class="bg-success text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90">✓ Verify</button>
              <button onclick="saRejectPayment(${p.id})" class="border border-danger text-danger px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-danger hover:text-white transition-all">✗ Reject</button>
            </div>
          </div>`).join('')}
      </div>`}
    `;
    content.classList.remove('hidden');
    document.getElementById('loading').classList.add('hidden');
  }

  async function saVerifyPayment(id, amount) {
    openModal(`
      <div class="p-6">
        <h3 class="font-display text-lg font-bold text-[#1a1410] mb-2">Verify Payment</h3>
        <p class="text-sm text-[#7a6655] mb-4">Confirm the amount after checking the screenshot.</p>
        ${buildFormField('sa-verify-amt', 'Verified Amount (₹)', 'number', '', amount)}
        <div class="flex gap-3 mt-5">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4] hover:bg-[#f2ebe0]">Cancel</button>
          <button onclick="submitSaVerify(${id})" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-[#2d6a4f] hover:opacity-90">✓ Verify</button>
        </div>
      </div>
    `);
  }
  async function submitSaVerify(id) {
    const amount = document.getElementById('sa-verify-amt').value;
    if (!amount) { showToast('Enter amount', 'error'); return; }
    closeModal();
    try { await api.verifyPayment(id, parseFloat(amount)); showToast('Payment verified!'); showSection('payments'); }
    catch(e) { showToast(e.data?.message || 'Failed', 'error'); }
  }

  async function saRejectPayment(id) {
    openModal(`
      <div class="p-6">
        <h3 class="font-display text-lg font-bold text-[#c1121f] mb-2">Reject Payment</h3>
        ${buildFormField('sa-reject-reason', 'Reason', 'text', 'e.g. Screenshot unclear')}
        <div class="flex gap-3 mt-5">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4]">Cancel</button>
          <button onclick="submitSaReject(${id})" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-[#c1121f] hover:opacity-90">Reject</button>
        </div>
      </div>
    `);
  }
  async function submitSaReject(id) {
    const reason = document.getElementById('sa-reject-reason').value.trim();
    if (!reason) { showToast('Provide a reason', 'error'); return; }
    closeModal();
    try { await api.rejectPayment(id, reason); showToast('Payment rejected.'); showSection('payments'); }
    catch(e) { showToast(e.data?.message || 'Failed', 'error'); }
  }

  // Boot
  showSection('dashboard');
</script>
</body>
</html>
