<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PG A1 | Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=DM+Sans:wght@300;400;500;600;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { cream:'#faf6f0', warm:'#f2ebe0', sand:'#e8d8c4', amber:'#c8813a', 'amber-hover':'#e09a50', dark:'#1a1410', charcoal:'#3d3028', mid:'#7a6655', light:'#b8a898', success:'#2d6a4f', 'success-bg':'#d8f3dc', danger:'#c1121f', 'danger-bg':'#fde8e8', info:'#1d4ed8', 'info-bg':'#dbeafe' },
        fontFamily: { display:['Playfair Display','serif'], body:['DM Sans','sans-serif'], brand:['Roboto','sans-serif'] },
        boxShadow: { card:'0 4px 32px rgba(26,20,16,0.10)', 'card-hover':'0 12px 48px rgba(26,20,16,0.18)' }
      }}
    }
  </script>
  <style>body{font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}</style>
</head>
<body class="bg-cream text-charcoal">

<!-- Sidebar -->
<aside id="sidebar" class="fixed h-screen w-60 left-0 top-0 bg-dark flex flex-col z-40 hidden md:flex">
  <div class="p-6">
    <div class="flex items-end gap-0">
      <span class="font-brand text-lg font-bold text-white">PG&nbsp;A</span>
      <span class="font-brand text-3xl font-black text-amber leading-[0.82]">1</span>
    </div>
    <p class="text-[11px] font-semibold tracking-[0.18em] uppercase text-light mt-1">Admin Panel</p>
  </div>
  <nav class="flex-1 mt-2">
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-amber text-white bg-charcoal" data-section="dashboard">
      <span class="material-symbols-outlined text-amber">dashboard</span><span class="text-sm font-medium">Dashboard</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="tenants">
      <span class="material-symbols-outlined">groups</span><span class="text-sm font-medium">Tenants</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="rooms">
      <span class="material-symbols-outlined">bed</span><span class="text-sm font-medium">Rooms & Beds</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="payments">
      <span class="material-symbols-outlined">payments</span><span class="text-sm font-medium">Payments</span>
      <span id="payment-badge" class="ml-auto text-[10px] bg-danger text-white px-1.5 py-0.5 rounded-full font-bold hidden">0</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="onboarding">
      <span class="material-symbols-outlined">person_add</span><span class="text-sm font-medium">Onboarding</span>
      <span id="onboarding-badge" class="ml-auto text-[10px] bg-amber text-white px-1.5 py-0.5 rounded-full font-bold hidden">0</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="notes">
      <span class="material-symbols-outlined">sticky_note_2</span><span class="text-sm font-medium">Notes</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="expenses">
      <span class="material-symbols-outlined">account_balance_wallet</span><span class="text-sm font-medium">Expenses</span>
    </a>
    <a class="nav-link flex items-center gap-3 px-5 py-3 border-l-4 border-transparent text-light hover:text-white hover:bg-charcoal cursor-pointer transition-colors" data-section="electricity">
      <span class="material-symbols-outlined">electric_bolt</span><span class="text-sm font-medium">Electricity</span>
    </a>
  </nav>
  <div class="p-4 border-t border-charcoal">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber flex items-center justify-center text-white font-bold text-sm" id="sidebar-avatar">A</div>
      <div>
        <p class="text-sm font-bold text-white" id="sidebar-name">Admin</p>
        <button onclick="api.logout()" class="text-[10px] tracking-wider uppercase text-light hover:text-amber">Logout</button>
      </div>
    </div>
  </div>
</aside>

<!-- Header -->
<header class="fixed top-0 right-0 md:left-60 left-0 h-16 bg-white border-b border-sand shadow-sm flex justify-between items-center px-4 md:px-6 z-30">
  <div class="flex items-center gap-3">
    <button class="md:hidden p-2" onclick="document.getElementById('sidebar').classList.toggle('hidden')">
      <span class="material-symbols-outlined text-dark">menu</span>
    </button>
    <select id="pg-selector" class="text-sm border border-sand bg-warm rounded-lg px-3 py-2 text-charcoal font-medium focus:ring-amber focus:border-amber min-w-[200px]" onchange="switchPg()"></select>
  </div>
  <button onclick="api.logout()" class="md:hidden text-xs text-mid font-bold">Logout</button>
</header>

<!-- Main -->
<main class="md:ml-60 min-h-screen px-4 pb-20 md:px-6 md:pb-6" style="padding-top:5rem;" id="main"></main>

<!-- Mobile Nav -->
<nav class="md:hidden fixed bottom-0 left-0 w-full h-16 bg-white border-t border-sand shadow-lg flex justify-around items-center z-50 rounded-t-2xl">
  <a onclick="showSection('dashboard')" class="flex flex-col items-center gap-0.5 text-amber"><span class="material-symbols-outlined">dashboard</span><span class="text-[10px] font-semibold">Home</span></a>
  <a onclick="showSection('tenants')" class="flex flex-col items-center gap-0.5 text-mid"><span class="material-symbols-outlined">groups</span><span class="text-[10px] font-semibold">Tenants</span></a>
  <a onclick="showSection('payments')" class="flex flex-col items-center gap-0.5 text-mid"><span class="material-symbols-outlined">payments</span><span class="text-[10px] font-semibold">Payments</span></a>
  <a onclick="showSection('rooms')" class="flex flex-col items-center gap-0.5 text-mid"><span class="material-symbols-outlined">bed</span><span class="text-[10px] font-semibold">Rooms</span></a>
</nav>

<script src="js/api.js?v=2"></script>
<script src="js/modal.js?v=2"></script>
<script>
if (!requireAuth(['admin','super_admin'])) throw new Error('Unauthorized');

// Date formatting helper
function fmtDate(d) {
  if (!d) return '—';
  const date = new Date(d);
  if (isNaN(date)) return d;
  return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

const user = api.getUser();
document.getElementById('sidebar-name').textContent = user.name;
document.getElementById('sidebar-avatar').textContent = user.name.substring(0,2).toUpperCase();

let pgLocations = [];
let currentPgId = null;

// Nav links
document.querySelectorAll('.nav-link').forEach(link => {
  link.addEventListener('click', () => {
    // Update active state
    document.querySelectorAll('.nav-link').forEach(l => {
      l.classList.remove('border-amber', 'text-white', 'bg-charcoal');
      l.classList.add('border-transparent', 'text-light');
    });
    link.classList.add('border-amber', 'text-white', 'bg-charcoal');
    link.classList.remove('border-transparent', 'text-light');
    showSection(link.dataset.section);
  });
});

async function init() {
  try {
    console.log('Admin init: fetching PG locations...');
    const data = await api.adminPgLocations();
    console.log('Admin init: got data', data);
    pgLocations = data.pg_locations || [];
    const sel = document.getElementById('pg-selector');
    if (pgLocations.length === 0) {
      sel.innerHTML = '<option value="">All PG Locations</option>';
      currentPgId = null;
    } else {
      sel.innerHTML = '<option value="">All PGs</option>' + pgLocations.map(pg => `<option value="${pg.id}">${pg.name.replace(/\u2013/g, '-')}</option>`).join('');
      currentPgId = pgLocations[0].id;
      sel.value = currentPgId;
    }
    showSection('dashboard');
  } catch (err) {
    console.error('Admin init error:', err);
    document.getElementById('main').innerHTML = `<div class="text-center py-8"><p class="text-danger font-medium">Failed to load dashboard.</p><p class="text-xs text-mid mt-1">${err?.data?.message || err?.message || 'Unknown error'}</p><button onclick="init()" class="mt-3 text-amber font-bold text-sm hover:underline">Retry</button></div>`;
  }
}

function switchPg() {
  const val = document.getElementById('pg-selector').value;
  currentPgId = val ? parseInt(val) : null;
  showSection('dashboard');
}

async function showSection(section) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="flex justify-center py-12"><span class="material-symbols-outlined text-3xl text-amber animate-spin">progress_activity</span></div>';

  try {
    switch (section) {
      case 'dashboard': await renderAdminDashboard(); break;
      case 'tenants': await renderTenants(); break;
      case 'rooms': await renderRooms(); break;
      case 'payments': await renderPayments(); break;
      case 'onboarding': await renderOnboarding(); break;
      case 'notes': await renderNotes(); break;
      case 'expenses': await renderExpenses(); break;
      case 'electricity': await renderElectricity(); break;
      default: main.innerHTML = '<p class="text-mid text-center py-8">Section not found.</p>';
    }
  } catch(err) {
    console.error('Section error:', err);
    main.innerHTML = `<div class="text-center py-8"><p class="text-danger font-medium">Something went wrong.</p><p class="text-xs text-mid mt-1">${err.data?.message || err.message || 'Unknown error'}</p><button onclick="showSection('${section}')" class="mt-3 text-amber font-bold text-sm hover:underline">Retry</button></div>`;
  }
}

async function renderAdminDashboard() {
  const [tenantsData, paymentsData, roomsData] = await Promise.all([
    api.adminTenants(currentPgId ? `pg_location_id=${currentPgId}` : ''),
    api.adminPayments(),
    api.adminRooms(currentPgId || '')
  ]);

  const tenants = tenantsData.tenants || [];
  const payments = paymentsData.payments || [];
  const rooms = roomsData.rooms || [];
  const pendingCount = payments.length;
  const badge = document.getElementById('payment-badge');
  if (pendingCount > 0) { badge.textContent = pendingCount; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); }

  // Fetch onboarding count (submitted applications awaiting approval)
  try {
    const onbData = await api.listApplications('submitted');
    const submittedCount = (onbData.applications || []).length;
    const onbBadge = document.getElementById('onboarding-badge');
    if (submittedCount > 0) { onbBadge.textContent = submittedCount; onbBadge.classList.remove('hidden'); } else { onbBadge.classList.add('hidden'); }
  } catch(e) {}

  const currentPg = pgLocations.find(p => p.id === currentPgId);
  const totalBeds = rooms.reduce((sum, r) => sum + (r.beds?.length || 0), 0);
  const occupiedBeds = rooms.reduce((sum, r) => sum + (r.beds?.filter(b => b.status === 'occupied').length || 0), 0);

  document.getElementById('main').innerHTML = `
    <div class="mb-6">
      <h2 class="font-display text-2xl font-black text-dark">${currentPg?.name || 'Admin Dashboard'}</h2>
      <p class="text-sm text-mid mt-1">${tenants.length} tenants • ${totalBeds} beds • ${pendingCount} pending payments</p>
    </div>
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
        <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Active Tenants</p>
        <h3 class="font-display text-2xl font-black text-dark mt-1">${tenants.filter(t=>t.status==='active').length}</h3>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
        <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Total Beds</p>
        <h3 class="font-display text-2xl font-black text-dark mt-1">${totalBeds}</h3>
        <p class="text-xs text-success mt-1">${totalBeds - occupiedBeds} available</p>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
        <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Pending Payments</p>
        <h3 class="font-display text-2xl font-black ${pendingCount > 0 ? 'text-danger' : 'text-dark'} mt-1">${pendingCount}</h3>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-sand shadow-card">
        <p class="text-[10px] font-semibold tracking-widest uppercase text-mid">Rooms</p>
        <h3 class="font-display text-2xl font-black text-dark mt-1">${rooms.length}</h3>
      </div>
    </div>
    <!-- Quick Actions -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <button onclick="generateOnboarding()" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left">
        <span class="material-symbols-outlined text-amber text-2xl">link</span>
        <p class="text-xs font-bold text-dark mt-2">Onboarding Link</p>
      </button>
      <button onclick="showSection('rooms')" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left">
        <span class="material-symbols-outlined text-amber text-2xl">add</span>
        <p class="text-xs font-bold text-dark mt-2">Add Room/Bed</p>
      </button>
      <button onclick="showSection('payments')" class="p-4 bg-white rounded-2xl border border-sand shadow-card hover:shadow-card-hover transition-all text-left">
        <span class="material-symbols-outlined text-amber text-2xl">verified</span>
        <p class="text-xs font-bold text-dark mt-2">Verify Payments</p>
      </button>
    </div>`;
}

async function renderTenants() {
  const data = await api.adminTenants(currentPgId ? `pg_location_id=${currentPgId}` : '');
  const tenants = data.tenants || [];

  document.getElementById('main').innerHTML = `
    <div class="flex flex-wrap justify-between items-center gap-3 mb-4 sticky top-16 bg-cream z-10 py-3 -mx-4 px-4 md:-mx-6 md:px-6">
      <h2 class="font-display text-2xl font-black text-dark">Tenants</h2>
      <div class="flex gap-2 flex-wrap">
        <button onclick="showTrash()" class="border border-danger text-danger px-3 py-2 rounded-lg text-xs font-bold hover:bg-danger hover:text-white transition-all flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">delete</span>Trash
        </button>
        <button onclick="showGenerateRentModal()" class="bg-amber text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-amber-hover flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">receipt_long</span>Generate Rent
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-4">
      <input type="text" id="filter-name" placeholder="Search by name..." oninput="filterTenants()" class="text-sm px-3 py-2 rounded-lg border border-sand bg-white text-charcoal placeholder-light focus:ring-2 focus:ring-amber focus:border-amber outline-none w-48" />
      <select id="filter-room" onchange="filterTenants()" class="text-sm px-3 py-2 rounded-lg border border-sand bg-white text-charcoal focus:ring-2 focus:ring-amber focus:border-amber outline-none">
        <option value="">All Rooms</option>
        ${[...new Set(tenants.map(t => t.current_bed_allocation?.bed?.room?.room_number).filter(Boolean))].sort().map(r => `<option value="${r}">Room ${r}</option>`).join('')}
      </select>
      <select id="filter-payment" onchange="filterTenants()" class="text-sm px-3 py-2 rounded-lg border border-sand bg-white text-charcoal focus:ring-2 focus:ring-amber focus:border-amber outline-none">
        <option value="">All Payment Status</option>
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
        <option value="in_progress">In Progress</option>
      </select>
      <select id="filter-status" onchange="filterTenants()" class="text-sm px-3 py-2 rounded-lg border border-sand bg-white text-charcoal focus:ring-2 focus:ring-amber focus:border-amber outline-none">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="offboarded">Offboarded</option>
      </select>
    </div>

    ${tenants.length === 0 ? '<p class="text-mid text-center py-8">No tenants yet.</p>' : `
    <div class="bg-white rounded-2xl border border-sand shadow-card">
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[700px]">
          <thead><tr class="text-left text-[10px] font-semibold tracking-widest uppercase text-mid border-b border-sand">
            <th class="p-3">Tenant</th><th class="p-3">Room</th><th class="p-3">Rent</th><th class="p-3">Rent Paid</th><th class="p-3">Elec Paid</th><th class="p-3">Status</th><th class="p-3">Actions</th>
          </tr></thead>
          <tbody id="tenants-tbody">${tenants.map(t => renderTenantRow(t)).join('')}
          </tbody>
        </table>
      </div>
    </div>`}
  `;

  // Store tenants data for filtering
  window._tenantsData = tenants;
}

function getPaymentStatus(t) {
  const rent = t.latest_rent;
  if (!rent) return { label: '—', class: 'text-mid bg-warm' };
  if (rent.status === 'paid') return { label: 'Paid', class: 'text-success bg-success-bg' };
  const hasPending = (rent.payment_submissions || []).some(ps => ps.status === 'verification_pending' || ps.status === 'submitted');
  if (hasPending) return { label: 'In Progress', class: 'text-amber bg-warm' };
  return { label: 'Unpaid', class: 'text-danger bg-danger-bg' };
}

function renderTenantRow(t) {
  const payStatus = getPaymentStatus(t);
  const name = t.user?.name || '—';
  const safeName = name.replace(/'/g, "\\'");

  // Electricity status
  const elecAllocs = t.electricity_bill_allocations || [];
  const unpaidElec = elecAllocs.filter(a => a.status === 'unpaid');
  const elecStatus = elecAllocs.length === 0 ? { label: '—', class: 'text-mid bg-warm' }
    : unpaidElec.length === 0 ? { label: 'Paid', class: 'text-success bg-success-bg' }
    : { label: 'Unpaid', class: 'text-danger bg-danger-bg' };

  return `
    <tr class="border-b border-sand/50 hover:bg-warm/30 transition-colors tenant-row" data-name="${name.toLowerCase()}" data-status="${t.status}" data-payment="${payStatus.label.toLowerCase().replace(' ','_')}" data-room="${t.current_bed_allocation?.bed?.room?.room_number || ''}">
      <td class="p-3">
        <p class="font-bold text-dark">${name}</p>
        <p class="text-[10px] text-amber font-mono">${t.tenant_id}</p>
        <a href="tel:${t.user?.mobile || ''}" class="text-[10px] text-mid hover:text-amber">📞 ${t.user?.mobile || ''}</a>
      </td>
      <td class="p-3 text-mid text-xs">${t.current_bed_allocation?.bed?.room?.room_number ? 'R' + t.current_bed_allocation.bed.room.room_number + '/B' + t.current_bed_allocation.bed.bed_number : '—'}</td>
      <td class="p-3 font-bold text-dark">₹${parseInt(t.current_rent).toLocaleString('en-IN')}</td>
      <td class="p-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${payStatus.class}">${payStatus.label}</span></td>
      <td class="p-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${elecStatus.class}">${elecStatus.label}</span></td>
      <td class="p-3"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${t.status==='active' ? 'text-success bg-success-bg' : 'text-danger bg-danger-bg'}">${t.status}</span></td>
      <td class="p-3">
        <div class="flex gap-1.5 items-center">
          <button onclick="viewTenantDetail(${t.id})" class="text-[10px] font-bold bg-warm text-charcoal px-2 py-1 rounded hover:bg-sand" title="View Details">👁</button>
          <button onclick="showChangeRentModal(${t.id}, '${safeName}', ${t.current_rent})" class="text-[10px] font-bold text-amber hover:underline" title="Change Rent">₹</button>
          <button onclick="showElecAdjustModal(${t.id}, '${safeName}', '${t.tenant_id}')" class="text-[10px] font-bold text-amber hover:underline" title="Electricity">⚡</button>
          <button onclick="showChangeRoomModal(${t.id}, '${safeName}')" class="text-[10px] font-bold text-amber hover:underline" title="Change Room">🏠</button>
          <button onclick="softDeleteTenant(${t.id}, '${safeName}')" class="text-[10px] font-bold text-danger hover:underline" title="Delete">🗑</button>
        </div>
      </td>
    </tr>`;
}

function filterTenants() {
  const nameFilter = (document.getElementById('filter-name').value || '').toLowerCase();
  const roomFilter = document.getElementById('filter-room').value;
  const payFilter = document.getElementById('filter-payment').value;
  const statusFilter = document.getElementById('filter-status').value;

  document.querySelectorAll('.tenant-row').forEach(row => {
    const name = row.dataset.name;
    const room = row.dataset.room;
    const payment = row.dataset.payment;
    const status = row.dataset.status;

    let show = true;
    if (nameFilter && !name.includes(nameFilter)) show = false;
    if (roomFilter && room !== roomFilter) show = false;
    if (payFilter && payment !== payFilter) show = false;
    if (statusFilter && status !== statusFilter) show = false;

    row.style.display = show ? '' : 'none';
  });
}

async function viewTenantDetail(tenantId) {
  try {
    const data = await api.adminTenantDetail(tenantId);
    const t = data.tenant;
    const docs = t.documents || [];
    const bed = t.current_bed_allocation?.bed;
    const room = bed?.room;
    const rents = t.monthly_rents || [];
    const latestRent = rents[0];

    // Get verified payment submissions for screenshot viewing
    let paymentScreenshots = [];
    if (latestRent && latestRent.payment_submissions) {
      paymentScreenshots = latestRent.payment_submissions.filter(ps => ps.status === 'verified');
    }

    openModal(`
      <div class="p-5 max-h-[85vh] overflow-y-auto">
        <div class="flex justify-between items-start mb-3">
          <h3 class="font-display text-lg font-bold text-[#1a1410]">${t.user?.name || '—'}</h3>
          <div class="flex gap-2">
            <button onclick="impersonateTenant(${t.id})" class="text-[10px] font-bold bg-[#1d4ed8] text-white px-2.5 py-1.5 rounded-lg hover:opacity-90" title="View as Tenant">👤 Impersonate</button>
            <button onclick="showResetPasswordModal(${t.id}, '${(t.user?.name || '').replace(/'/g, "\\'")}')" class="text-[10px] font-bold bg-[#7a6655] text-white px-2.5 py-1.5 rounded-lg hover:opacity-90" title="Reset Password">🔑 Reset Pwd</button>

  closeModal();
  setTimeout(() => {
    openModal(`
      <div class="p-6">

async function submitResetPassword(tenantId) {
  const pwd = document.getElementById('reset-pwd').value.trim();
  if (!pwd || pwd.length < 6) { showToast('Password must be at least 6 characters', 'error'); return; }
  closeModal();
  try {
    const result = await api.resetTenantPassword(tenantId, pwd);
    showToast(result.message);
  } catch(err) { showToast(err.data?.message || 'Failed to reset password', 'error'); }
}

async function impersonateTenant(tenantId) {
  try {
    const result = await api.impersonateTenant(tenantId);
    
    // Store impersonation token in a separate key that tenant.html will check
    localStorage.setItem('pga1_impersonate_token', result.token);
    localStorage.setItem('pga1_impersonate_user', JSON.stringify(result.user));

    // Open tenant dashboard in new tab (it will detect impersonation mode)
    window.open('tenant.html?impersonate=1', '_blank');

    closeModal();
    showToast(`Opened ${result.user.name}'s dashboard in new tab`);
  } catch(err) { showToast(err.data?.message || 'Failed to impersonate', 'error'); }
}

async function loadPaymentScreenshot(paymentId) {
  const container = document.getElementById(`screenshot-container-${paymentId}`);
  if (!container) return;
  try {
    const resp = await fetch(`${API_BASE}/admin/payments/${paymentId}/screenshot`, {
      headers: { 'Authorization': `Bearer ${api.getToken()}` }
    });
    if (!resp.ok) throw new Error('Not found');
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    container.innerHTML = `
      <img src="${url}" alt="Payment screenshot" class="w-full max-h-48 object-cover" />
      <p class="text-[10px] text-center text-mid py-1 bg-warm">Tap to view full screenshot</p>
    `;
    container.dataset.blobUrl = url;
  } catch(e) {
    container.innerHTML = '<p class="p-3 text-xs text-mid text-center">Screenshot not available</p>';
  }
}

async function viewPaymentScreenshot(paymentId, tenantName, month) {
  const container = document.getElementById(`screenshot-container-${paymentId}`);
  let imgUrl = container?.dataset?.blobUrl;
  if (!imgUrl) {
    try {
      const resp = await fetch(`${API_BASE}/admin/payments/${paymentId}/screenshot`, {
        headers: { 'Authorization': `Bearer ${api.getToken()}` }
      });
      if (!resp.ok) { alert('Screenshot not available'); return; }
      const blob = await resp.blob();
      imgUrl = URL.createObjectURL(blob);
    } catch(e) { alert('Failed to load screenshot'); return; }
  }

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9999] bg-black/80 flex items-center justify-center p-4';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="relative max-w-lg w-full">
      <button onclick="this.closest('.fixed').remove()" class="absolute -top-10 right-0 text-white text-2xl font-bold hover:text-amber">&times;</button>
      <p class="text-white text-sm mb-2 text-center font-bold">${tenantName} — ${month}</p>
      <img src="${imgUrl}" alt="Payment screenshot" class="w-full rounded-xl shadow-2xl" style="max-height:80vh;object-fit:contain;" />
    </div>
  `;
  document.body.appendChild(overlay);
}

async function approveApplication(invitationId) {
  // Get available beds for the PG this candidate chose
  const appsData = await api.listApplications();
  const app = (appsData.applications || []).find(a => a.id === invitationId);
  const pgId = app?.preferred_pg_location_id || app?.pg_location_id || currentPgId;

  let bedsHtml = '<option value="">Loading...</option>';
  let allRooms = [];
  try {
    // Load rooms for current PG (same approach as Rooms & Beds section)
    const roomsData = await api.adminRooms(currentPgId || '');
    allRooms = roomsData.rooms || [];
    // If pgId differs from currentPgId, also load rooms for that PG
    if (pgId && pgId != currentPgId) {
      const extraData = await api.adminRooms(pgId);
      const extraRooms = extraData.rooms || [];
      extraRooms.forEach(r => {
        if (!allRooms.find(existing => existing.id === r.id)) {
          allRooms.push(r);
        }
      });
    }
  } catch(e) { console.error('Failed to load rooms:', e); }

  // Filter beds by selected PG (loose comparison for int/string)
  function getBedsForPg(filterPgId) {
    const availableBeds = [];
    allRooms.forEach(r => {
      const roomPgId = r.pg_location_id || r.pg_location?.id;
      if (filterPgId && roomPgId != filterPgId) return;
      (r.beds || []).forEach(b => {
        if (b.status === 'available' || !b.status) {
          availableBeds.push({ id: b.id, label: `Room ${r.room_number} - Bed ${b.bed_number} (₹${parseInt(b.monthly_rent).toLocaleString('en-IN')}/mo)`, rent: b.monthly_rent });
        }
      });
    });
    return availableBeds;
  }

  const availableBeds = getBedsForPg(null); // Show all available beds from loaded rooms (already PG-filtered by API)
  if (availableBeds.length === 0) {
    bedsHtml = '<option value="">No available beds! Add rooms/beds first.</option>';
  } else {
    bedsHtml = '<option value="">Select Room & Bed</option>' + availableBeds.map(b => `<option value="${b.id}" data-rent="${b.rent}">${b.label}</option>`).join('');
  }

  const today = new Date().toISOString().split('T')[0];
  const pgSelectHtml = pgLocations.map(pg => `<option value="${pg.id}" ${pg.id == pgId ? 'selected' : ''}>${pg.name.replace(/\u2013/g, '-')}</option>`).join('');

  // Store for PG change handler
  window._approveAllRooms = allRooms;

  openModal(`
    <div class="p-6">
      <h3 class="font-display text-lg font-bold text-[#1a1410] mb-1">Approve & Assign Tenant</h3>
      <p class="text-xs text-[#c8813a] font-semibold mb-4">${app?.candidate_name || 'Candidate'}</p>
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">PG Location *</label>
          <select id="approve-pg" onchange="onApprovePgChange()" class="w-full bg-[#f2ebe0] text-sm px-3 py-2.5 rounded-xl border border-[#e8d8c4] focus:ring-2 focus:ring-[#c8813a] outline-none">
            ${pgSelectHtml}
          </select>
        </div>
        <div>
          <label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">Assign Room & Bed *</label>
          <select id="approve-bed" onchange="onBedSelect()" class="w-full bg-[#f2ebe0] text-sm px-3 py-2.5 rounded-xl border border-[#e8d8c4] focus:ring-2 focus:ring-[#c8813a] outline-none">
            ${bedsHtml}
          </select>
          <span class="text-[10px] text-[#7a6655] mt-1 block">Only available beds are shown. If empty, add rooms & beds first.</span>
        </div>
        ${buildFormField('approve-rent', 'Monthly Rent (₹)', 'number', '8000', '8000')}
        ${buildFormField('approve-joining', 'Joining Date', 'date', '', today)}
        ${buildFormField('approve-deposit', 'Security Deposit (₹)', 'number', '0', '0')}
      </div>
      <div class="flex gap-3 mt-5">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4] hover:bg-[#f2ebe0]">Cancel</button>
        <button onclick="submitApproval(${invitationId})" class="flex-1 py-2.5 rounded-lg text-sm font-bold text-white bg-[#2d6a4f] hover:opacity-90">✓ Approve</button>
      </div>
    </div>
  `);
}

function onBedSelect() {
  const select = document.getElementById('approve-bed');
  const option = select.options[select.selectedIndex];
  const rent = option.getAttribute('data-rent');
  if (rent) document.getElementById('approve-rent').value = parseInt(rent);
}

async function onApprovePgChange() {
  const pgId = document.getElementById('approve-pg').value;
  const bedSelect = document.getElementById('approve-bed');
  bedSelect.innerHTML = '<option value="">Loading beds...</option>';

  try {
    const roomsData = await api.adminRooms(pgId || '');
    const rooms = roomsData.rooms || [];
    window._approveAllRooms = rooms;

    const availableBeds = [];
    rooms.forEach(r => {
      (r.beds || []).forEach(b => {
        if (b.status === 'available' || !b.status) {
          availableBeds.push({ id: b.id, label: `Room ${r.room_number} - Bed ${b.bed_number} (₹${parseInt(b.monthly_rent).toLocaleString('en-IN')}/mo)`, rent: b.monthly_rent });
        }
      });
    });

    if (availableBeds.length === 0) {
      bedSelect.innerHTML = '<option value="">No available beds in this PG</option>';
    } else {
      bedSelect.innerHTML = '<option value="">Select Room & Bed</option>' + availableBeds.map(b => `<option value="${b.id}" data-rent="${b.rent}">${b.label}</option>`).join('');
    }
  } catch(e) {
    bedSelect.innerHTML = '<option value="">Error loading beds</option>';
  }
}

async function submitApproval(invitationId) {
  const pgId = document.getElementById('approve-pg').value;
  const bedId = document.getElementById('approve-bed').value;
  const rent = document.getElementById('approve-rent').value;
  const joining = document.getElementById('approve-joining').value;
  const deposit = document.getElementById('approve-deposit').value;

  if (!pgId) { showToast('Please select a PG location', 'error'); return; }
  if (!bedId) { showToast('Please select a room & bed', 'error'); return; }
  if (!rent) { showToast('Please enter rent amount', 'error'); return; }
  if (!joining) { showToast('Please set joining date', 'error'); return; }

  closeModal();
  try {
    const result = await api.approveApplication(invitationId, {
      pg_location_id: parseInt(pgId),
      bed_id: parseInt(bedId),
      rent: parseFloat(rent),
      joining_date: joining,
      security_deposit: parseFloat(deposit) || 0
    });
    showToast(`Tenant approved! ID: ${result.tenant_id}`);
    showSection('onboarding');
  } catch(err) {
    showToast(err.data?.message || 'Approval failed', 'error');
  }
}

        </div>
      </div>
      <div class="flex gap-3 mt-5">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-lg text-sm font-semibold text-[#7a6655] border border-[#e8d8c4] hover:bg-[#f2ebe0]">Cancel</button>

      </div>
    </div>
  `);

  // Auto-calculate units when readings change
  document.getElementById('elec-prev-reading').addEventListener('input', autoCalcUnits);
  document.getElementById('elec-curr-reading').addEventListener('input', autoCalcUnits);
}

function autoCalcUnits() {
  const prev = parseFloat(document.getElementById('elec-prev-reading').value) || 0;
  const curr = parseFloat(document.getElementById('elec-curr-reading').value) || 0;
  if (curr > prev) {
    document.getElementById('elec-units').value = (curr - prev).toFixed(2);
  }
}

async function submitElectricityBill() {
  const roomId = document.getElementById('elec-room').value;
  const month = document.getElementById('elec-month').value;
  const units = document.getElementById('elec-units').value;
  const rate = document.getElementById('elec-rate').value;
  const prevReading = document.getElementById('elec-prev-reading').value;
  const currReading = document.getElementById('elec-curr-reading').value;
  const prevImg = document.getElementById('elec-prev-img').files[0];
  const currImg = document.getElementById('elec-curr-img').files[0];

  if (!roomId || !month || !units || !rate) { showToast('Room, month, units, and rate are required', 'error'); return; }
  closeModal();

  try {
    const formData = new FormData();
    formData.append('room_id', parseInt(roomId));
    formData.append('billing_month', month);
    formData.append('total_units', parseFloat(units));
    formData.append('rate_per_unit', parseFloat(rate));
    if (prevReading) formData.append('previous_reading', parseFloat(prevReading));
    if (currReading) formData.append('current_reading', parseFloat(currReading));
    if (prevImg) formData.append('previous_meter_image', prevImg);
    if (currImg) formData.append('current_meter_image', currImg);

    await api.upload('/admin/electricity-bills', formData);
    showToast('Electricity bill created and split among tenants!');
  } catch(err) { showToast(err.data?.message || 'Failed', 'error'); }
}

// ─── Document Preview ────────────────────────────────────────
async function previewDocument(docId, docType, mimeType) {
  const token = api.getToken();
  const url = `http://127.0.0.1:8000/api/v1/admin/documents/${docId}/view`;

  openModal(`
    <div class="p-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-display text-base font-bold text-[#1a1410] capitalize">${docType.replace(/_/g, ' ')}</h3>
        <button onclick="closeModal()" class="text-[#7a6655] hover:text-[#1a1410]">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="bg-[#f2ebe0] rounded-xl overflow-hidden flex items-center justify-center min-h-[200px]" id="doc-preview-container">
        <span class="material-symbols-outlined text-3xl text-[#c8813a] animate-spin">progress_activity</span>
      </div>
      <button onclick="openDocInNewTab(${docId})" class="block w-full mt-3 text-center text-sm font-bold text-[#c8813a] hover:underline">
        Open full size in new tab ↗
      </button>
    </div>
  `);

  try {
    const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!resp.ok) throw new Error('Failed');
    const blob = await resp.blob();
    const objectUrl = URL.createObjectURL(blob);
    const container = document.getElementById('doc-preview-container');
    if (mimeType === 'application/pdf') {
      container.innerHTML = `<embed src="${objectUrl}" type="application/pdf" class="w-full h-[400px] rounded-lg" />`;
    } else {
      container.innerHTML = `<img src="${objectUrl}" class="max-w-full max-h-[400px] rounded-lg object-contain" />`;
    }
  } catch (e) {
    document.getElementById('doc-preview-container').innerHTML = `<p class="text-[#c1121f] text-sm p-4">Failed to load document.</p>`;
  }
}

async function openDocInNewTab(docId) {
  const token = api.getToken();
  const url = `http://127.0.0.1:8000/api/v1/admin/documents/${docId}/view`;
  const resp = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
  const blob = await resp.blob();
  window.open(URL.createObjectURL(blob), '_blank');
}

        <label class="flex items-center gap-2 cursor-pointer">

      </div>
    </div>
  `);
}

// ─── Expenses Section ───────────────────────────────────────
let expenseMonth = new Date().toISOString().substring(0, 7);

async function renderExpenses() {
  const main = document.getElementById('main');
  try {
    const data = await api.getExpenses(expenseMonth, currentPgId || '');

    main.innerHTML = `<p class="text-danger text-center py-8">Failed to load expenses. <button onclick="renderExpenses()" class="text-amber font-bold">Retry</button></p>`;

}

    <div class="flex items-center gap-3 mb-4">

      <table class="w-full text-sm min-w-[600px]">

        <tbody>
          ${expenses.map(e => `

              <td class="p-3 text-xs text-mid">${fmtDate(e.expense_date)}</td>
              <td class="p-3"><p class="font-bold text-dark">${e.title}</p>${e.notes ? `<p class="text-[10px] text-mid mt-0.5">${e.notes}</p>` : ''}</td>

                <button onclick="deleteExpense(${e.id}, '${e.title.replace(/'/g,"\\'")}')" class="text-[10px] font-bold text-danger hover:underline">Delete</button>

        <tfoot><tr class="border-t-2 border-sand"><td class="p-3"></td><td class="p-3 font-bold text-dark text-xs">TOTAL</td><td class="p-3 font-bold text-dark">₹${parseInt(total).toLocaleString('en-IN')}</td><td colspan="2"></td></tr></tfoot>

    <div><label class="text-[10px] font-semibold uppercase tracking-widest text-[#7a6655] block mb-1">Bill Screenshot (Optional)</label><input type="file" id="exp-image" accept="image/*" class="w-full text-xs file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#f2ebe0] file:text-[#3d3028] hover:file:bg-[#e8d8c4]" /></div>

  const notes = document.getElementById('exp-notes').value.trim();

// ─── Electricity Section ────────────────────────────────────
let elecMonth = new Date().toISOString().substring(0, 7);

async function renderElectricity() {
  const main = document.getElementById('main');
  try {
    const [roomsData, billsData] = await Promise.all([
      api.adminRooms(currentPgId || ''),
      api.get(`/admin/electricity-bills${currentPgId ? '?pg_location_id=' + currentPgId : ''}`)
    ]);
    const rooms = roomsData.rooms || [];
    const allBills = billsData.bills || [];
    const monthBills = elecMonth ? allBills.filter(b => b.billing_month && b.billing_month.startsWith(elecMonth)) : allBills;
    const billsByRoom = {};
    monthBills.forEach(b => { billsByRoom[b.room_id] = b; });
    const statusFilter = document.getElementById('elec-status-filter')?.value || '';

    main.innerHTML = `
      <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
        <h2 class="font-display text-2xl font-black text-dark">Electricity Bills</h2>
        <div class="flex items-center gap-2 flex-wrap">
          <select id="elec-status-filter" onchange="renderElectricity()" class="text-xs px-3 py-2 rounded-lg border border-sand bg-white text-charcoal focus:ring-2 focus:ring-amber outline-none">
            <option value="">All Status</option>
            <option value="paid">Paid</option>
            <option value="unpaid">Unpaid</option>
            <option value="partial">Partial</option>
          </select>
          <input type="month" value="${elecMonth}" onchange="elecMonth=this.value;renderElectricity()"
            class="text-sm px-3 py-2 rounded-lg border border-sand bg-white text-charcoal focus:ring-2 focus:ring-amber outline-none" />
          <button onclick="exportElecExcel()" class="bg-success text-white px-3 py-2 rounded-lg text-xs font-bold hover:opacity-90 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">download</span>Export Excel
          </button>
        </div>
      </div>
      ${rooms.length === 0 ? '<div class="bg-white p-8 rounded-2xl border border-sand shadow-card text-center"><p class="text-mid">No rooms found.</p></div>' : `
      <div class="bg-white rounded-2xl border border-sand shadow-card overflow-x-auto">
        <table class="w-full text-sm min-w-[750px]">
          <thead><tr class="text-left text-[10px] font-semibold tracking-widest uppercase text-mid border-b border-sand bg-warm">
            <th class="p-3">Room</th><th class="p-3">Last Unit</th><th class="p-3">Current Unit</th><th class="p-3">Units Used</th><th class="p-3">Rate (₹)</th><th class="p-3">Total (₹)</th><th class="p-3">Tenants</th><th class="p-3">Per Person</th><th class="p-3">Status</th><th class="p-3">Meter 📷</th><th class="p-3">Action</th>
          </tr></thead>
          <tbody>${rooms.map(r => {
            const bill = billsByRoom[r.id];
            const tc = (r.beds||[]).filter(b=>b.status==='occupied').length;
            if (statusFilter && bill) { const al=bill.allocations||[]; const ap=al.length>0&&al.every(a=>a.status==='paid'); const sp=al.some(a=>a.status==='paid'); const bs=ap?'paid':sp?'partial':'unpaid'; if(statusFilter!==bs) return ''; }
            if (statusFilter && !bill) return '';
            if (bill) return `<tr class="border-b border-sand/50 bg-success-bg/20"><td class="p-3 font-bold text-dark">Room ${r.room_number}</td><td class="p-3">${bill.previous_reading||'—'}</td><td class="p-3">${bill.current_reading||'—'}</td><td class="p-3 font-bold">${bill.total_units}</td><td class="p-3">₹${bill.rate_per_unit}</td><td class="p-3 font-bold">₹${parseInt(bill.total_amount).toLocaleString('en-IN')}</td><td class="p-3 text-center">${bill.active_tenants_count}</td><td class="p-3 font-bold text-amber">₹${parseInt(bill.per_tenant_amount).toLocaleString('en-IN')}</td><td class="p-3">${(()=>{const al=bill.allocations||[];const ap=al.length>0&&al.every(a=>a.status==='paid');const sp=al.some(a=>a.status==='paid');return ap?'<span class="text-[10px] font-bold text-success bg-success-bg px-2 py-0.5 rounded-full">Paid</span>':sp?'<span class="text-[10px] font-bold text-amber bg-warm px-2 py-0.5 rounded-full">Partial</span>':'<span class="text-[10px] font-bold text-danger bg-danger-bg px-2 py-0.5 rounded-full">Unpaid</span>';})()}</td><td class="p-3"><div class="flex gap-1">${bill.previous_meter_image?`<button onclick="viewElecMeter(${bill.id},'previous')" class="text-[10px] text-amber font-bold">Prev</button>`:''} ${bill.current_meter_image?`<button onclick="viewElecMeter(${bill.id},'current')" class="text-[10px] text-amber font-bold">Curr</button>`:''}</div></td><td class="p-3"><span class="text-[10px] font-bold text-success">✓ Saved</span></td></tr>`;
            return `<tr class="border-b border-sand/50 hover:bg-warm/30"><td class="p-3 font-bold text-dark">Room ${r.room_number}</td><td class="p-3"><input type="number" id="prev-${r.id}" placeholder="0" class="w-20 text-xs px-2 py-1.5 rounded-lg border border-sand bg-cream outline-none focus:ring-1 focus:ring-amber" oninput="calcRow(${r.id})" /></td><td class="p-3"><input type="number" id="curr-${r.id}" placeholder="0" class="w-20 text-xs px-2 py-1.5 rounded-lg border border-sand bg-cream outline-none focus:ring-1 focus:ring-amber" oninput="calcRow(${r.id})" /></td><td class="p-3"><span id="units-${r.id}" class="font-bold">0</span></td><td class="p-3"><input type="number" id="rate-${r.id}" value="10" class="w-14 text-xs px-2 py-1.5 rounded-lg border border-sand bg-cream outline-none focus:ring-1 focus:ring-amber" oninput="calcRow(${r.id})" /></td><td class="p-3"><span id="total-${r.id}" class="font-bold">₹0</span></td><td class="p-3 text-center">${tc||'—'}</td><td class="p-3"><span id="pp-${r.id}" class="font-bold text-amber">${tc?'₹0':'—'}</span></td><td class="p-3"><span class="text-[10px] text-light">—</span></td><td class="p-3"><input type="file" id="prev-img-${r.id}" accept="image/*" class="hidden"/><input type="file" id="curr-img-${r.id}" accept="image/*" class="hidden"/><button type="button" onclick="document.getElementById('prev-img-${r.id}').click()" class="text-[10px] text-amber font-bold">+P</button> <button type="button" onclick="document.getElementById('curr-img-${r.id}').click()" class="text-[10px] text-amber font-bold">+C</button></td><td class="p-3"><button type="button" onclick="saveElecRow(${r.id},${tc})" class="text-[10px] font-bold bg-amber text-white px-3 py-1.5 rounded-lg hover:bg-amber-hover">Save</button></td></tr>`;
          }).join('')}</tbody>
        </table>
      </div>
      <p class="text-xs text-mid mt-3">💡 Enter Last & Current readings. Total = (Current − Last) × Rate. Auto-splits among room tenants.</p>`}`;
  } catch(err) { main.innerHTML = `<p class="text-danger text-center py-8">Failed. <button onclick="renderElectricity()" class="text-amber font-bold">Retry</button></p>`; }
}

function calcRow(roomId) {
  const prev = parseFloat(document.getElementById(`prev-${roomId}`)?.value) || 0;
  const curr = parseFloat(document.getElementById(`curr-${roomId}`)?.value) || 0;
  const rate = parseFloat(document.getElementById(`rate-${roomId}`)?.value) || 10;
  const units = curr > prev ? (curr - prev) : 0;
  const total = units * rate;
  document.getElementById(`units-${roomId}`).textContent = units.toFixed(1);
  document.getElementById(`total-${roomId}`).textContent = '₹' + parseInt(total).toLocaleString('en-IN');
  const ppEl = document.getElementById(`pp-${roomId}`);
  if (ppEl && ppEl.textContent !== '—') {
    const row = document.getElementById(`total-${roomId}`).closest('tr');
    const tcCell = row?.querySelectorAll('td')[6];
    const tc = parseInt(tcCell?.textContent) || 1;
    ppEl.textContent = tc > 0 ? '₹' + parseInt(total / tc).toLocaleString('en-IN') : '—';
  }
}

async function saveElecRow(roomId, tenantCount) {
  const prev = document.getElementById(`prev-${roomId}`)?.value;
  const curr = document.getElementById(`curr-${roomId}`)?.value;
  const rate = document.getElementById(`rate-${roomId}`)?.value;
  const prevNum = parseFloat(prev)||0, currNum = parseFloat(curr)||0, rateNum = parseFloat(rate)||10;
  const units = currNum > prevNum ? (currNum - prevNum) : 0;
  if (units <= 0) { showToast('Current must be greater than Last', 'error'); return; }
  const fd = new FormData();
  fd.append('room_id', roomId); fd.append('billing_month', elecMonth);
  fd.append('total_units', units); fd.append('rate_per_unit', rateNum);
  fd.append('previous_reading', prevNum); fd.append('current_reading', currNum);
  const prevImg = document.getElementById(`prev-img-${roomId}`)?.files[0];
  const currImg = document.getElementById(`curr-img-${roomId}`)?.files[0];
  if (prevImg) fd.append('previous_meter_image', prevImg);
  if (currImg) fd.append('current_meter_image', currImg);
  try { const r = await api.upload('/admin/electricity-bills', fd); showToast(r.message||'Saved!'); renderElectricity(); }
  catch(err) { showToast(err.data?.message||'Failed', 'error'); }
}

async function viewElecMeter(billId, type) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 z-[9999] bg-black/80 flex items-center justify-center p-4';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = '<div class="text-center"><span class="material-symbols-outlined text-3xl text-white animate-spin">progress_activity</span></div>';
  document.body.appendChild(overlay);
  try {
    const resp = await fetch(`${API_BASE}/admin/electricity-bills/${billId}/meter-image/${type}`, { headers: { 'Authorization': `Bearer ${api.getToken()}` } });
    if (!resp.ok) throw new Error();
    const blob = await resp.blob();
    overlay.innerHTML = `<div class="relative max-w-lg w-full"><button onclick="this.closest('.fixed').remove()" class="absolute -top-10 right-0 text-white text-2xl font-bold hover:text-amber">&times;</button><p class="text-white text-sm mb-2 text-center font-bold">${type==='previous'?'Previous':'Current'} Meter</p><img src="${URL.createObjectURL(blob)}" class="w-full rounded-xl shadow-2xl" style="max-height:80vh;object-fit:contain;" /></div>`;
  } catch(e) { overlay.remove(); showToast('Failed to load image', 'error'); }
}

function exportElecExcel() {
  const table = document.querySelector('#main table');
  if (!table) { showToast('No data to export', 'error'); return; }
  let csv = '';
  table.querySelectorAll('tr').forEach(row => {
    const cells = row.querySelectorAll('th, td');
    const rowData = [];
    cells.forEach(cell => { let t = cell.textContent.trim().replace(/\s+/g,' ').replace(/,/g,''); rowData.push('"'+t+'"'); });
    rowData.splice(-2, 2); // Remove Meter & Action columns
    csv += rowData.join(',') + '\n';
  });
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `electricity-bills-${elecMonth||'all'}.csv`;
  a.click();
  showToast('Excel file downloaded!');
}
