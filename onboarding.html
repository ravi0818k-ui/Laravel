<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PG A1 – Tenant Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=DM+Sans:wght@300;400;500;600&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #faf6f0;
      --warm: #f2ebe0;
      --sand: #e8d8c4;
      --amber: #c8813a;
      --amber2: #e09a50;
      --dark: #1a1410;
      --charcoal: #3d3028;
      --mid: #7a6655;
      --light: #b8a898;
      --white: #ffffff;
      --shadow: 0 4px 32px rgba(26,20,16,.10);
      --shadow2: 0 12px 48px rgba(26,20,16,.18);
      --red: #d94040;
      --green: #25D366;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      min-height: 100vh;
    }

    /* ── NAV ── */
    .onboard-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,246,240,.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--sand);
      padding: 0 5vw;
      display: flex; align-items: center; justify-content: center;
      height: 64px;
    }
    .onboard-nav-logo {
      display: flex; align-items: flex-end; gap: 0; line-height: 1;
    }
    .onboard-nav-logo .logo-pg {
      font-family: 'Roboto', sans-serif;
      font-size: 1.4rem; font-weight: 700; color: var(--dark); line-height: 1;
    }
    .onboard-nav-logo .logo-one {
      font-family: 'Roboto', sans-serif;
      font-size: 2.5rem; font-weight: 900; color: var(--amber);
      line-height: 0.82; letter-spacing: -.02em;
    }

    /* ── HERO BANNER ── */
    .onboard-hero {
      background: var(--dark);
      padding: 3rem 5vw 2.5rem;
      text-align: center;
    }
    .onboard-hero-badge {
      display: inline-block;
      background: var(--amber); color: var(--white);
      font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
      padding: .3rem .8rem; border-radius: 2px;
      margin-bottom: 1rem;
    }
    .onboard-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 900; color: var(--white);
      line-height: 1.2; margin-bottom: .6rem;
    }
    .onboard-hero p {
      font-size: .92rem; color: rgba(255,255,255,.6); font-weight: 300;
      max-width: 500px; margin: 0 auto;
    }

    /* ── FORM CONTAINER ── */
    .onboard-container {
      max-width: 640px;
      margin: -2rem auto 3rem;
      padding: 0 1.2rem;
    }
    .onboard-card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: var(--shadow2);
      padding: 2.5rem 2rem;
    }
    @media (max-width: 480px) {
      .onboard-card { padding: 1.8rem 1.2rem; }
    }

    /* ── PROGRESS STEPS ── */
    .progress-bar {
      display: flex; align-items: center; justify-content: center;
      gap: .5rem; margin-bottom: 2rem;
    }
    .progress-step {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700;
      background: var(--warm); color: var(--mid);
      border: 2px solid var(--sand);
      transition: all .3s;
    }
    .progress-step.active {
      background: var(--amber); color: var(--white);
      border-color: var(--amber);
    }
    .progress-step.done {
      background: var(--dark); color: var(--white);
      border-color: var(--dark);
    }
    .progress-line {
      width: 2.5rem; height: 2px;
      background: var(--sand);
      transition: background .3s;
    }
    .progress-line.active { background: var(--amber); }

    /* ── SECTION TITLES ── */
    .form-section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem; font-weight: 700; color: var(--dark);
      margin-bottom: .3rem;
    }
    .form-section-desc {
      font-size: .82rem; color: var(--mid); margin-bottom: 1.5rem;
    }

    /* ── FORM ELEMENTS ── */
    .form-group {
      margin-bottom: 1.4rem;
    }
    .form-group label {
      display: block;
      font-size: .82rem; font-weight: 600; color: var(--charcoal);
      margin-bottom: .4rem;
    }
    .form-group label .required { color: var(--red); }
    .form-group label .optional { color: var(--light); font-weight: 400; font-size: .75rem; }

    .form-group input[type="text"],
    .form-group input[type="tel"],
    .form-group input[type="email"],
    .form-group input[type="date"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: .75rem 1rem;
      border: 1.5px solid var(--sand);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      color: var(--charcoal);
      background: var(--cream);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(200,129,58,.12);
    }
    .form-group input.error,
    .form-group select.error,
    .form-group textarea.error {
      border-color: var(--red);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group .hint {
      display: block; font-size: .72rem; color: var(--light); margin-top: .3rem;
    }
    .form-group .error-msg {
      display: none; font-size: .72rem; color: var(--red); margin-top: .3rem;
    }

    /* DOB row */
    .dob-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .6rem;
    }

    /* ── UPLOAD SECTIONS ── */
    .upload-area {
      border: 2px dashed var(--sand);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .upload-area:hover {
      border-color: var(--amber);
      background: rgba(200,129,58,.04);
    }
    .upload-area .upload-icon { font-size: 1.8rem; margin-bottom: .5rem; }
    .upload-area .upload-text { font-size: .82rem; color: var(--mid); font-weight: 500; }
    .upload-area .upload-hint { font-size: .7rem; color: var(--light); margin-top: .3rem; }

    .upload-preview {
      display: none;
      position: relative;
      margin-top: .8rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--sand);
    }
    .upload-preview.visible { display: block; }
    .upload-preview img {
      width: 100%; max-height: 200px; object-fit: cover;
    }
    .upload-preview .pdf-badge {
      padding: .8rem 1rem;
      background: var(--warm);
      font-size: .82rem; font-weight: 500; color: var(--charcoal);
    }
    .upload-preview .remove-btn {
      position: absolute; top: 8px; right: 8px;
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(0,0,0,.6); color: var(--white);
      border: none; cursor: pointer;
      font-size: .85rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .upload-preview .remove-btn:hover { background: var(--red); }

    .upload-options {
      display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .6rem;
    }
    .upload-btn {
      display: flex; align-items: center; justify-content: center; gap: .4rem;
      padding: .7rem .8rem;
      border: 1.5px solid var(--sand);
      border-radius: 8px;
      background: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem; font-weight: 600; color: var(--charcoal);
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .upload-btn:hover {
      border-color: var(--amber);
      background: rgba(200,129,58,.04);
    }

    /* ── DOC TYPE TOGGLE ── */
    .doc-type-toggle {
      display: flex; gap: 0; margin-bottom: 1rem;
      border: 1.5px solid var(--sand); border-radius: 8px;
      overflow: hidden;
    }
    .doc-type-toggle button {
      flex: 1; padding: .6rem;
      border: none; background: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: .8rem; font-weight: 600; color: var(--mid);
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .doc-type-toggle button.active {
      background: var(--amber); color: var(--white);
    }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex; gap: .8rem; margin-top: 2rem;
    }
    .btn-next, .btn-submit {
      flex: 1;
      padding: .85rem 1.5rem;
      border: none; border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .92rem; font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-next {
      background: var(--amber); color: var(--white);
    }
    .btn-next:hover { background: var(--amber2); transform: translateY(-2px); }
    .btn-back {
      flex: 0 0 auto;
      padding: .85rem 1.5rem;
      border: 1.5px solid var(--sand); border-radius: 8px;
      background: var(--white);
      font-family: 'DM Sans', sans-serif;
      font-size: .92rem; font-weight: 600; color: var(--mid);
      cursor: pointer;
      transition: border-color .2s;
    }
    .btn-back:hover { border-color: var(--amber); color: var(--amber); }
    .btn-submit {
      background: var(--dark); color: var(--white);
    }
    .btn-submit:hover { background: var(--charcoal); transform: translateY(-2px); }

    /* ── REFERRAL CODE BOX ── */
    .referral-box {
      background: var(--warm);
      border: 1px solid var(--sand);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.4rem;
    }
    .referral-box label {
      font-size: .78rem; color: var(--mid); margin-bottom: .4rem;
    }

    /* ── FORM STEPS ── */
    .form-step { display: none; }
    .form-step.active { display: block; }

    /* ── MODALS / OVERLAYS ── */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.6);
      align-items: center; justify-content: center;
    }
    .overlay.active { display: flex; }
    .modal-content {
      background: var(--white); border-radius: 16px;
      padding: 2rem; max-width: 380px; width: calc(100vw - 40px);
      text-align: center;
      box-shadow: var(--shadow2);
    }
    .modal-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem; font-weight: 700; color: var(--dark);
      margin: .8rem 0 .5rem;
    }
    .modal-content p {
      font-size: .88rem; color: var(--mid); margin-bottom: 1.2rem;
    }
    .modal-icon { font-size: 3rem; }
    .modal-btn {
      display: inline-block;
      padding: .7rem 1.5rem; border-radius: 8px;
      background: var(--amber); color: var(--white);
      font-weight: 700; font-size: .88rem;
      border: none; cursor: pointer;
      transition: background .2s;
    }
    .modal-btn:hover { background: var(--amber2); }

    /* Loading spinner */
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid var(--sand);
      border-top-color: var(--amber);
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PDF PASSWORD MODAL ── */
    .pdf-modal-input {
      width: 100%; padding: .7rem 1rem;
      border: 1.5px solid var(--sand); border-radius: 8px;
      font-size: .9rem; margin: .8rem 0;
      outline: none;
    }
    .pdf-modal-input:focus { border-color: var(--amber); }
    .pdf-modal-hint {
      background: var(--warm); border-radius: 8px;
      padding: .8rem; margin-bottom: 1rem;
      font-size: .78rem; color: var(--charcoal); text-align: left;
    }
    .pdf-modal-btns {
      display: flex; gap: .6rem;
    }
    .pdf-modal-btns .modal-btn { flex: 1; }
    .pdf-modal-btns .btn-cancel {
      flex: 1; padding: .7rem;
      border: 1.5px solid var(--sand); border-radius: 8px;
      background: var(--white); color: var(--mid);
      font-weight: 600; cursor: pointer;
    }

    /* ── FOOTER ── */
    .onboard-footer {
      background: var(--dark); color: rgba(255,255,255,.4);
      text-align: center; padding: 1.5rem 5vw;
      font-size: .78rem;
    }
    .onboard-footer span { color: var(--amber); }

    /* ── INVALID TOKEN PAGE ── */
    .invalid-token-page {
      display: none;
      text-align: center;
      padding: 4rem 2rem;
    }
    .invalid-token-page.active { display: block; }
    .invalid-token-page .icon { font-size: 4rem; margin-bottom: 1rem; }
    .invalid-token-page h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem; font-weight: 700; color: var(--dark);
      margin-bottom: .5rem;
    }
    .invalid-token-page p {
      font-size: .92rem; color: var(--mid); max-width: 400px; margin: 0 auto;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav class="onboard-nav">
  <a href="index.html" class="onboard-nav-logo" style="text-decoration:none;">
    <span class="logo-pg">PG&nbsp;A</span>
    <span class="logo-one">1</span>
  </a>
</nav>

<!-- HERO BANNER -->
<div class="onboard-hero">
  <div class="onboard-hero-badge">Tenant Onboarding</div>
  <h1>Welcome to PG A1</h1>
  <p>Complete your registration to get started. This takes about 3 minutes.</p>
</div>

<!-- MAIN CONTENT -->
<div class="onboard-container">

  <!-- Invalid Token State -->
  <div class="invalid-token-page" id="invalidTokenPage">
    <div class="icon">🔗</div>
    <h2>Invalid or Expired Link</h2>
    <p>This onboarding link is no longer valid. Please contact your PG admin to get a new one.</p>
  </div>

  <!-- Onboarding Form -->
  <div class="onboard-card" id="onboardingForm">
    <!-- Progress -->
    <div class="progress-bar">
      <div class="progress-step active" id="step-ind-1">1</div>
      <div class="progress-line" id="line-1"></div>
      <div class="progress-step" id="step-ind-2">2</div>
      <div class="progress-line" id="line-2"></div>
      <div class="progress-step" id="step-ind-3">3</div>
    </div>

    <form id="pgForm" novalidate enctype="multipart/form-data">
